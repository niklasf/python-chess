name: Test

on: [push, pull_request]

permissions:
  contents: read

env:
  UV_LOCKED: 1

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.16"]
      fail-fast: false
    continue-on-error: ${{ matrix.python-version == '3.16' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: .github/workflows/setup-${{ matrix.os }}.sh
        shell: bash
      - run: uv run --no-dev python test.py -v
  perft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.15"
      - run: uv run --no-dev python examples/perft/perft.py -t 1 examples/perft/random.perft --max-nodes 10000
      - run: uv run --no-dev python examples/perft/perft.py -t 1 examples/perft/chess960.perft --max-nodes 100000
      - run: uv run --no-dev python examples/perft/perft.py -t 1 examples/perft/tricky.perft
      - run: uv run --no-dev python examples/perft/perft.py -t 1 --variant giveaway examples/perft/giveaway.perft
      - run: uv run --no-dev python examples/perft/perft.py -t 1 --variant atomic examples/perft/atomic.perft
      - run: uv run --no-dev python examples/perft/perft.py -t 1 --variant racingkings examples/perft/racingkings.perft
      - run: uv run --no-dev python examples/perft/perft.py -t 1 --variant horde examples/perft/horde.perft
      - run: uv run --no-dev python examples/perft/perft.py -t 1 --variant crazyhouse examples/perft/crazyhouse.perft
      - run: uv run --no-dev python examples/perft/perft.py -t 1 --variant 3check examples/perft/3check.perft
  typing:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.16"]
      fail-fast: false
    continue-on-error: ${{ matrix.python-version == '3.16' }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash --noprofile --norc -O globstar -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --no-dev --group typing mypy --strict chess
      - run: uv run --no-dev --group typing mypy --strict examples/**/*.py
      - run: uv run --no-dev --group typing pyright chess
      - run: uv run --no-dev --group typing pyright examples/**/*.py
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.15"
      - run: uv build
      - run: uv run twine check --strict dist/*
      - run: .github/workflows/setup-ubuntu-latest.sh
      - run: uv run --no-dev python -m doctest README.rst
